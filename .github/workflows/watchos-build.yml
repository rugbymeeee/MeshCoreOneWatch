name: watchOS Build

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  watchos-packages:
    name: Build packages for watchOS
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Ensure watchOS platform is installed
        run: |
          if ! xcodebuild -showsdks | grep -q watchos; then
            echo "watchOS SDK missing - downloading platform"
            xcodebuild -downloadPlatform watchOS
          fi
          xcodebuild -showsdks | grep -i watch

      # MC1Services depends on MeshCore, so this builds both packages.
      - name: Build MC1Services for watchOS
        working-directory: MC1Services
        run: |
          xcodebuild build \
            -scheme MC1Services \
            -destination "generic/platform=watchOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

  # lint.yml only runs on main/dev and PRs; mirror it for feature-branch pushes.
  lint:
    name: Formatting and Linting
    if: github.event_name == 'push'
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install SwiftLint
        run: command -v swiftlint >/dev/null 2>&1 || brew install swiftlint

      - name: Install SwiftFormat
        env:
          SWIFTFORMAT_VERSION: 0.63.0
        run: |
          curl -sSL --fail -o /tmp/swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -o -q /tmp/swiftformat.zip -d /tmp/swiftformat-bin
          chmod +x /tmp/swiftformat-bin/swiftformat
          echo "/tmp/swiftformat-bin" >> "$GITHUB_PATH"

      - name: Lint
        run: swiftlint lint --strict

      - name: Format
        run: swiftformat --lint --strict .
