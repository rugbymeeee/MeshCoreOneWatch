name: Watch Simulator

# End-to-end check of the iPhone -> Apple Watch bridge without hardware: runs the iPhone app
# on its demo radio (-screenshotMode, Debug + simulator only) next to the watch app in a
# paired watch simulator, then uploads screenshots and logs as the "watch-simulator" artifact.

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "MC1/**"
      - "MC1Watch/**"
      - "MC1Services/**"
      - "MeshCore/**"
      - "project.yml"
      - ".github/workflows/watch-simulator.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulators:
    name: iPhone + Apple Watch simulators
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}/watch-simulator
      PHONE_BUNDLE_ID: io.pocketmeshtest.app
      WATCH_BUNDLE_ID: io.pocketmeshtest.app.watchkitapp

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v swiftgen >/dev/null 2>&1 || brew install swiftgen

      - name: Generate Xcode project
        run: make generate

      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project MC1.xcodeproj \
            -scheme MC1 \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath .derivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Ensure the watchOS simulator runtime is installed
        run: |
          if ! xcrun simctl list runtimes | grep -q watchOS; then
            echo "watchOS simulator runtime missing - downloading platform"
            xcodebuild -downloadPlatform watchOS
          fi
          xcrun simctl list runtimes

      - name: Create and boot a paired iPhone and Apple Watch
        run: |
          # Newest available iOS and watchOS runtimes, preferring an Ultra watch. The script goes
          # through a file: macOS bash 3.2 cannot parse a heredoc inside $(...).
          cat > "$RUNNER_TEMP/pick_simulators.py" <<'PY'
          import json, subprocess

          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]))["runtimes"]

          def available(platform):
              return [
                  r for r in runtimes
                  if r.get("isAvailable") and (r.get("platform") == platform or f"SimRuntime.{platform}-" in r["identifier"])
              ]

          def latest(platform):
              candidates = available(platform)
              if not candidates:
                  raise SystemExit(f"No available {platform} simulator runtime")
              return max(candidates, key=lambda r: [int(p) for p in r["version"].split(".")])

          def device_type(runtime, prefixes):
              for prefix in prefixes:
                  for device in runtime["supportedDeviceTypes"]:
                      if device["name"].startswith(prefix):
                          return device["identifier"]
              raise SystemExit(f"No device type for {runtime['name']}")

          # iOS and watchOS share version numbers; a matching pair is the one Xcode ships together
          # (a newer iOS runtime on the image may be a preview that does not boot).
          watch = latest("watchOS")
          matching = [r for r in available("iOS") if r["version"] == watch["version"]]
          ios = matching[0] if matching else latest("iOS")
          print(f"IOS_RUNTIME={ios['identifier']}")
          print(f"WATCH_RUNTIME={watch['identifier']}")
          print(f"PHONE_TYPE={device_type(ios, ['iPhone 18 Pro', 'iPhone 18', 'iPhone 17 Pro', 'iPhone 17', 'iPhone 16', 'iPhone'])}")
          print(f"WATCH_TYPE={device_type(watch, ['Apple Watch Ultra', 'Apple Watch'])}")
          PY
          python3 "$RUNNER_TEMP/pick_simulators.py" > "$RUNNER_TEMP/simulators.env"
          source "$RUNNER_TEMP/simulators.env"
          echo "iPhone: $PHONE_TYPE on $IOS_RUNTIME"
          echo "Watch:  $WATCH_TYPE on $WATCH_RUNTIME"

          PHONE=$(xcrun simctl create "CI iPhone" "$PHONE_TYPE" "$IOS_RUNTIME")
          WATCH=$(xcrun simctl create "CI Watch" "$WATCH_TYPE" "$WATCH_RUNTIME")
          xcrun simctl pair "$WATCH" "$PHONE"
          xcrun simctl list pairs | grep -A2 "CI Watch\|CI iPhone" || true

          echo "PHONE=$PHONE" >> "$GITHUB_ENV"
          echo "WATCH=$WATCH" >> "$GITHUB_ENV"

      - name: Run the apps and take screenshots
        run: |
          mkdir -p "$OUT"
          APP=.derivedData/Build/Products/Debug-iphonesimulator/MC1.app

          # Runtime disk images are sometimes not mounted yet on a fresh runner ("cannot determine
          # the runtime bundle"); restarting CoreSimulator and retrying gets past it.
          boot_device() {
            for attempt in 1 2 3 4 5; do
              if xcrun simctl list devices | grep "$1" | grep -q "(Booted)"; then break; fi
              if xcrun simctl boot "$1"; then break; fi
              echo "::warning::Boot attempt $attempt for $1 failed; restarting CoreSimulator"
              killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
              sleep 20
            done
            xcrun simctl bootstatus "$1" -b
          }

          # Installing the iPhone app while its paired watch is running took the watch simulator
          # down, so install it first and only then boot the watch and add the watch app. The
          # companion app is then already present when the watch app appears.
          boot_device "$PHONE"
          xcrun simctl install "$PHONE" "$APP"
          boot_device "$WATCH"
          xcrun simctl install "$WATCH" "$APP/Watch/MC1Watch.app"
          xcrun simctl list pairs | grep -A2 "CI Watch\|CI iPhone" || true

          # Our logs plus WatchConnectivity's, in the apps and in the wcd daemon.
          predicate='subsystem == "com.mc1" OR process == "MC1" OR process == "MC1Watch" OR process == "wcd" OR subsystem CONTAINS[c] "watchconnectivity"'
          xcrun simctl spawn "$PHONE" log stream --level info --style compact --predicate "$predicate" > "$OUT/iphone.log" 2>&1 &
          PHONE_LOG_PID=$!
          xcrun simctl spawn "$WATCH" log stream --level info --style compact --predicate "$predicate" > "$OUT/watch.log" 2>&1 &
          WATCH_LOG_PID=$!
          sleep 10

          # The iPhone app connects to its demo radio and publishes the watch snapshot.
          xcrun simctl launch "$PHONE" "$PHONE_BUNDLE_ID" -screenshotMode
          sleep 45
          xcrun simctl io "$PHONE" screenshot "$OUT/1-iphone.png"

          xcrun simctl launch "$WATCH" "$WATCH_BUNDLE_ID"
          sleep 20
          xcrun simctl io "$WATCH" screenshot "$OUT/2-watch.png"
          sleep 40
          xcrun simctl io "$WATCH" screenshot "$OUT/3-watch-later.png"

          kill "$PHONE_LOG_PID" "$WATCH_LOG_PID" 2>/dev/null || true
          echo "--- iPhone log (bridge) ---"
          grep -iE "watch (session|snapshot)" "$OUT/iphone.log" || echo "(no bridge lines)"
          echo "--- Watch log (bridge) ---"
          grep -iE "watch (session|snapshot)" "$OUT/watch.log" || echo "(no bridge lines)"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-simulator
          path: watch-simulator
